<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>
<body>
    <form id="calcForm">
        1st Number: <input type="number" id="num1" required><br><br>
        2nd Number: <input type="number" id="num2" required><br><br>
        <button type="button" onclick="calculate('multiply')">Multiply</button>
        <button type="button" onclick="calculate('divide')">Divide</button>
    </form>
    <p>The result is: <span id="result"></span></p>

    <script>
        function calculate(operation) {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let result;

            if (isNaN(num1) || isNaN(num2)) {
                result = "Please enter valid numbers";
            } else if (operation === 'multiply') {
                result = num1 * num2;
            } else if (operation === 'divide') {
                if (num2 === 0) {
                    result = "Cannot divide by zero";
                } else {
                    result = num1 / num2;
                }
            }
            document.getElementById("result").innerText = result;
        }
    </script>
</body>
</html>
